# ---------------------------------------------------------------------------
# Decap CMS + DecapBridge
# ---------------------------------------------------------------------------
# DecapBridge replaces the (deprecated) Netlify Identity service, so this CMS
# can run on GitHub Pages with real user logins instead of personal access
# tokens. Logins are managed from the DecapBridge dashboard.
#
# Endpoints below are generated per-site by DecapBridge — don't hand-edit them.
# Full walkthrough: ../CMS-SETUP.md
# ---------------------------------------------------------------------------

backend:
  name: git-gateway
  repo: waitholdthis/peachie_test
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/47cee576-5549-4f1b-8e38-48dea534880d/pkce
  auth_token_endpoint: /sites/47cee576-5549-4f1b-8e38-48dea534880d/token
  gateway_url: https://gateway.decapbridge.com

  # Record who made each change in the commit history.
  commit_messages:
    create: 'Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: 'Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge'

# Names/avatars come from the DecapBridge login rather than the git account.
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://diversehairdesignsbypeachienc.com
display_url: https://diversehairdesignsbypeachienc.com

# Changes are committed straight to `main`, which triggers the GitHub Pages
# deploy in .github/workflows/static.yml. The site is live ~1-2 minutes later.
publish_mode: simple

# Default home for uploaded pictures. Individual sections override this below
# so photos land next to the ones already there.
media_folder: 'images'
public_folder: 'images'

collections:
  # =========================================================================
  # PHOTOS — the portfolio grid on the homepage
  # =========================================================================
  - name: 'gallery'
    label: 'Photo Gallery'
    label_singular: 'Photo Gallery'
    description: 'The portfolio grid on the homepage. Add, remove, or drag to reorder — the first photo is shown large, and the first 12 show before "Load More".'
    editor:
      preview: false
    files:
      - name: 'photos'
        label: 'Gallery Photos'
        file: 'gallery.json'
        media_folder: '/gallery'
        public_folder: 'gallery'
        fields:
          - name: 'images'
            label: 'Photos'
            label_singular: 'Photo'
            widget: 'list'
            summary: '{{fields.alt}}'
            collapsed: true
            fields:
              - name: 'image'
                label: 'Photo'
                widget: 'image'
                required: true
                hint: 'Landscape or portrait both work. Please keep files under about 5 MB so the page stays fast.'
              - name: 'alt'
                label: 'Description (for screen readers & Google)'
                widget: 'string'
                required: false
                default: 'Hair transformation by Peachie'

  # =========================================================================
  # VIDEOS — the "See it in Action" section
  # =========================================================================
  - name: 'videos'
    label: 'Videos'
    label_singular: 'Videos'
    description: 'The "See it in Action" reel. Videos autoplay muted and loop, so short clips work best.'
    editor:
      preview: false
    files:
      - name: 'reel'
        label: 'Video Reel'
        file: 'videos.json'
        media_folder: '/videos'
        public_folder: 'videos'
        fields:
          - name: 'videos'
            label: 'Videos'
            label_singular: 'Video'
            widget: 'list'
            summary: '{{fields.label}}'
            collapsed: true
            fields:
              - name: 'file'
                label: 'Video file (MP4)'
                widget: 'file'
                required: false
                hint: 'Upload an MP4. Keep clips short — under 25 MB each, and never above 100 MB (GitHub rejects larger files).'
              - name: 'label'
                label: 'Caption (optional)'
                widget: 'string'
                required: false
              - name: 'streamId'
                label: 'Cloudflare Stream ID (existing videos only)'
                widget: 'string'
                required: false
                hint: 'Leave this alone. The six original videos are hosted on Cloudflare and use this instead of an uploaded file. For new videos, upload an MP4 above and leave this blank.'

  # =========================================================================
  # HOMEPAGE — text and the rest of the pictures
  # =========================================================================
  - name: 'homepage'
    label: 'Homepage'
    label_singular: 'Homepage'
    description: 'Wording and pictures for every section of the homepage.'
    editor:
      preview: false
    files:
      - name: 'content'
        label: 'Homepage Content'
        file: 'site-data.json'
        fields:
          # ----- Hero -------------------------------------------------------
          - name: 'hero'
            label: 'Top of the Page (Hero)'
            widget: 'object'
            fields:
              - { name: 'badge', label: 'Small label above the title', widget: 'string' }
              - name: 'heading'
                label: 'Main title'
                widget: 'string'
                hint: 'Contains formatting tags: <br> is a line break, <em>…</em> makes text italic. Keep them as they are unless you are sure.'
              - name: 'subHeading'
                label: 'Sentence under the title'
                widget: 'string'
                hint: '&nbsp; is a space that will not break onto a new line, &amp; is an ampersand (&).'
              - { name: 'ctaText', label: 'Button text', widget: 'string' }
              - name: 'ctaLink'
                label: 'Button link'
                widget: 'string'
                hint: 'Usually booking.html'
              - name: 'backgroundImage'
                label: 'Background photo'
                widget: 'image'
                required: false
              - name: 'mosaic'
                label: 'Photo strip under the button'
                label_singular: 'Photo'
                widget: 'list'
                collapsed: true
                summary: '{{fields.alt}}'
                fields:
                  - { name: 'image', label: 'Photo', widget: 'image' }
                  - { name: 'alt', label: 'Description', widget: 'string', required: false }

          # ----- Scrolling reel --------------------------------------------
          - name: 'marquee'
            label: 'Scrolling Photo Reel'
            label_singular: 'Photo'
            widget: 'list'
            collapsed: true
            summary: '{{fields.label}}'
            hint: 'The band of photos that slides sideways below the hero. The list is repeated automatically to make the loop seamless.'
            fields:
              - { name: 'image', label: 'Photo', widget: 'image' }
              - { name: 'label', label: 'Caption on the photo', widget: 'string', required: false }

          # ----- About ------------------------------------------------------
          - name: 'about'
            label: 'Our Story'
            widget: 'object'
            fields:
              - { name: 'label', label: 'Small label', widget: 'string' }
              - name: 'title'
                label: 'Section title'
                widget: 'string'
                hint: '<em>…</em> makes text italic.'
              - name: 'paragraphs'
                label: 'Paragraphs'
                label_singular: 'Paragraph'
                widget: 'list'
                field: { name: 'text', label: 'Paragraph', widget: 'text' }
              - { name: 'quote', label: 'Pull quote', widget: 'text' }
              - name: 'stats'
                label: 'Highlighted numbers'
                label_singular: 'Number'
                widget: 'list'
                collapsed: true
                summary: '{{fields.value}} — {{fields.label}}'
                fields:
                  - { name: 'value', label: 'Big text', widget: 'string' }
                  - { name: 'label', label: 'Caption', widget: 'string' }

          # ----- Services ---------------------------------------------------
          - name: 'services'
            label: 'Services & Pricing'
            label_singular: 'Service'
            widget: 'list'
            collapsed: true
            summary: '{{fields.title}} — {{fields.price}}'
            fields:
              - { name: 'title', label: 'Service name', widget: 'string' }
              - { name: 'image', label: 'Photo', widget: 'image', required: false }
              - { name: 'desc', label: 'Description', widget: 'text', required: false }
              - name: 'duration'
                label: 'How long it takes'
                widget: 'string'
                required: false
                hint: 'e.g. "3 hr 30 min" or "45 min · Under 12"'
              - name: 'price'
                label: 'Price'
                widget: 'string'
                hint: 'e.g. "$190+", "Varies", or "Call"'

          # ----- Testimonials -----------------------------------------------
          - name: 'testimonials'
            label: 'Client Reviews'
            label_singular: 'Review'
            widget: 'list'
            collapsed: true
            summary: '{{fields.author}}'
            fields:
              - { name: 'text', label: 'What they said', widget: 'text' }
              - { name: 'author', label: 'Who said it', widget: 'string' }

          # ----- Staff ------------------------------------------------------
          - name: 'staff'
            label: 'Meet the Stylist'
            widget: 'object'
            fields:
              - { name: 'name', label: 'Name', widget: 'string' }
              - { name: 'role', label: 'Job title', widget: 'string' }
              - { name: 'photo', label: 'Photo', widget: 'image' }
              - name: 'bio'
                label: 'Biography paragraphs'
                label_singular: 'Paragraph'
                widget: 'list'
                field: { name: 'text', label: 'Paragraph', widget: 'text' }
              - { name: 'quote', label: 'Closing quote', widget: 'text' }

          # ----- Contact ----------------------------------------------------
          - name: 'contact'
            label: 'Contact Details'
            widget: 'object'
            fields:
              - { name: 'phone', label: 'Phone number', widget: 'string' }
              - { name: 'location', label: 'Location', widget: 'string' }
              - name: 'socials'
                label: 'Social links'
                label_singular: 'Link'
                widget: 'list'
                collapsed: true
                summary: '{{fields.platform}}'
                fields:
                  - { name: 'platform', label: 'Platform', widget: 'string' }
                  - { name: 'url', label: 'Address', widget: 'string' }

          # ----- Newsletter -------------------------------------------------
          - name: 'newsletter'
            label: 'Newsletter Banner'
            widget: 'object'
            fields:
              - name: 'heading'
                label: 'Heading'
                widget: 'string'
                hint: '<em>…</em> makes text italic.'
              - { name: 'subtext', label: 'Sentence underneath', widget: 'text' }
